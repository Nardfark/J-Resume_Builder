    <style>
        :root {
            --primary: #ef4444;

            --text: #1a202c;
            --glass-bg: rgba(255,255,255,0.1);
            --glass-blur: blur(10px);

        * {

        body.red {

            --secondary: #ff5f5f92;
            --background: linear-gradient(135deg, #fee2e2, #ffffff);
            --text: #fff3d0;
        }
        body.green {
            --primary: #10b981;
            --secondary: #059669;
            --background: linear-gradient(135deg, #d1fae5, #ffffff);
            --text: #1a202c;
        }
        body.blue {

            --secondary: #1d4ed8;

            --text: #1a202c;

        body.light {
            --primary: #3b82f6;
            --secondary: #1d4ed8;
            --background: linear-gradient(135deg, #e0e7ff, #ffffff);
            --text: #1a202c;
            --glass-bg: rgba(255,255,255,0.2);
            --glass-blur: blur(8px);
        }
        body.dark {
            --primary: #93c5fd;
            --secondary: #60a5fa;
            --background: linear-gradient(135deg, #1f2937, #374151);
            --text: #e2e8f0;
            --glass-bg: rgba(0,0,0,0.2);
            --glass-blur: blur(12px);
        }
        body.glass {
            --primary: #d4af37;
            --secondary: #b8972e;
            --background: linear-gradient(135deg, #e5e7eb, #d1d5db);
            --text: var(--gold-text);

            background: var(--secondary);
            color: #ffffff;
        }

        }
        .additional-jobs.show {
            display: block;
        }
        .additional-toggle {
            color: var(--primary);
            cursor: pointer;
            text-decoration: underline;
            font-weight: 700;
            margin-top: 25px;
        }
        .button-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 1000;
        }
        .theme-selector, .theme-toggle, .pdf-button, .cover-letter-button, .simplified-toggle, .print-button {
            padding: 10px 20px;
            background: var(--primary);
            color: #ffffff;
            border: 1px solid var(--secondary);
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            font-size: 14px;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .modal-content {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            color: var(--text);
            padding: 50px;
            border-radius: 25px;
            max-width: 700px;
            width: 90%;
            border: 1px solid var(--primary);
        }
        .close {
            position: absolute;
            top: 20px;
            right: 25px;
            font-size: 2rem;
            cursor: pointer;
            color: var(--primary);
        }
        @media (max-width: 768px) {
            header h1 { font-size: 2.8rem; }

            nav ul li { margin: 12px 0; }

            .career-tabs { grid-template-columns: 1fr; }
            .button-container {
                bottom: 10px;
                right: 10px;

        }
        @media print {
            body {
                background: #ffffff !important;
                color: #000000 !important;
            }
            .container, header, nav, section, .career-tabs, .job, .modal-content {
                background: none !important;

                box-shadow: none !important;

                padding: 10px !important;
                margin: 10px 0 !important;
            }
            .button-container, .modal, .additional-toggle {
                display: none !important;
            }
            .additional-jobs.show {
                display: block !important;
            }
            h1, h2, h3, p, li {
                color: #000000 !important;
            }
        }
    </style>

                    </div>

                    </div>
                `;

        // Theme Management
        function applyTheme(theme) {
            const themes = {
                red: { 
                    primary: '#ef4444', 
                    secondary: '#b91c1c', 
                    background: 'linear-gradient(135deg, #fee2e2, #ffffff)', 
                    text: '#1a202c', 
                    glassBg: 'rgba(255,255,255,0.1)', 
                    glassBlur: 'blur(10px)' 
                },
                green: { 
                    primary: '#10b981', 
                    secondary: '#059669', 
                    background: 'linear-gradient(135deg, #d1fae5, #ffffff)', 
                    text: '#1a202c', 
                    glassBg: 'rgba(255,255,255,0.1)', 
                    glassBlur: 'blur(10px)' 
                },
                blue: { 
                    primary: '#3b82f6', 
                    secondary: '#1d4ed8', 
                    background: 'linear-gradient(135deg, #dbeafe, #ffffff)', 
                    text: '#1a202c', 
                    glassBg: 'rgba(255,255,255,0.1)', 
                    glassBlur: 'blur(10px)' 
                },
                light: { 
                    primary: '#3b82f6', 
                    secondary: '#1d4ed8', 
                    background: 'linear-gradient(135deg, #e0e7ff, #ffffff)', 
                    text: '#1a202c', 
                    glassBg: 'rgba(255,255,255,0.2)', 
                    glassBlur: 'blur(8px)' 
                },
                dark: { 
                    primary: '#93c5fd', 
                    secondary: '#60a5fa', 
                    background: 'linear-gradient(135deg, #1f2937, #374151)', 
                    text: '#e2e8f0', 
                    glassBg: 'rgba(0,0,0,0.2)', 
                    glassBlur: 'blur(12px)' 
                },
                glass: { 
                    primary: '#d4af37', 
                    secondary: '#b8972e', 
                    background: 'linear-gradient(135deg, #e5e7eb, #d1d5db)', 
                    text: '#d4af37', 
                    glassBg: 'rgba(255,255,255,0.15)', 
                    glassBlur: 'blur(10px)' 
                },
                metallic: { 
                    primary: '#d4af37', 
                    secondary: '#b8972e', 
                    background: 'linear-gradient(135deg, #1f2937, #374151)', 
                    text: '#d4af37', 
                    glassBg: 'rgba(0,0,0,0.25)', 
                    glassBlur: 'blur(10px)' 
                }
            };
            const selectedTheme = themes[theme] || themes.red;
            document.documentElement.style.setProperty('--primary', selectedTheme.primary);
            document.documentElement.style.setProperty('--secondary', selectedTheme.secondary);
            document.documentElement.style.setProperty('--background', selectedTheme.background);
            document.documentElement.style.setProperty('--text', selectedTheme.text);
            document.documentElement.style.setProperty('--glass-bg', selectedTheme.glassBg);
            document.documentElement.style.setProperty('--glass-blur', selectedTheme.glassBlur);
            document.body.classList.remove('red', 'green', 'blue', 'light', 'dark', 'glass', 'metallic', 'simplified');
            document.body.classList.add(theme);
            currentTheme = theme;
            localStorage.setItem('theme', theme);
            document.querySelector('.theme-selector').value = theme;
        }

        function selectTheme(theme) {
            applyTheme(theme);
            resumeData.settings.color_scheme = theme;
            renderResume(resumeData);
        }

        function toggleTheme() {
            const nextTheme = currentTheme === 'light' ? 'dark' : 'light';
            selectTheme(nextTheme);
        }

        function toggleSimplified() {
            if (document.body.classList.contains('simplified')) {
                document.body.classList.remove('simplified');
                applyTheme(currentTheme);
            } else {
                document.body.classList.remove('red', 'green', 'blue', 'light', 'dark', 'glass', 'metallic');
                document.body.classList.add('simplified');
            }
        }

        // Modal
        function openModal() {
            document.getElementById('coverLetterModal').style.display = 'flex';
        }
        function closeModal() {
            document.getElementById('coverLetterModal').style.display = 'none';
        }

        // PDF Download
        function downloadPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            let y = 20;

            // Header
            doc.setFontSize(20);
            doc.setTextColor(currentTheme === 'metallic' || currentTheme === 'glass' ? 212, 175, 55 : 0, 0, 0);
            doc.text('Resume', 10, y);
            y += 10;

            // Contact
            doc.setFontSize(12);
            doc.text(resumeData.name, 10, y);
            y += 5;
            doc.text(resumeData.contact.replace(/\|/g, ' | '), 10, y);
            y += 10;

            // Summary
            doc.text('Summary', 10, y);
            y += 5;
            const summaryLines = doc.splitTextToSize(document.querySelector('#summary p').textContent, 180);
            doc.text(summaryLines, 10, y);
            y += summaryLines.length * 5 + 10;

            // Experience
            doc.text('Experience', 10, y);
            y += 5;
            const jobs = resumeData.settings.organization === 'career_path' ?
                resumeData.jobs.filter(job => job.career_path === resumeData.jobs[0].career_path) :
                resumeData.jobs.sort((a, b) => new Date(b.start_date) - new Date(a.start_date));
            jobs.forEach(job => {
                doc.text(`${job.title} – ${job.company}, ${job.location}`, 10, y);
                y += 5;
                doc.text(`${job.start_date} – ${job.end_date}`, 10, y);
                y += 5;
                if (resumeData.settings.display_mode === 'full_info') {
                    const descLines = doc.splitTextToSize(job.description, 180);
                    doc.text(descLines, 10, y);
                    y += descLines.length * 5 + 5;
                } else {
                    y += 5;
                }
            });

            // Education
            doc.text('Education', 10, y);
            y += 5;
            resumeData.education.forEach(edu => {
                const eduText = `${edu.institution}, ${edu.location} – ${edu.degree}, ${edu.date}`;
                const eduLines = doc.splitTextToSize(eduText, 180);
                doc.text(eduLines, 10, y);
                y += eduLines.length * 5 + 5;
            });

            doc.save(`${resumeData.name.replace(/\s+/g, '_')}_Resume.pdf`);
        }

        // Print Resume
        function printResume() {
            window.print();
        }

        // Toggle Additional Jobs
        function toggleAdditional() {
            const additionalJobs = document.getElementById('additionalJobs');
            additionalJobs.classList.toggle('show');
            const toggleText = document.querySelector('.additional-toggle');
            toggleText.textContent = additionalJobs.classList.contains('show') ? 'Hide Additional Experience' : 'View Additional Experience';
        }

        // Smooth Scrolling
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', e => {
                e.preventDefault();
                document.querySelector(anchor.getAttribute('href')).scrollIntoView({ behavior: 'smooth' });
            });
        });

        // Load Theme
        const savedTheme = localStorage.getItem('theme') || 'red';
        applyTheme(savedTheme);

        // Initialize
        renderResume(resumeData);

        // Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
    <script>
        // Inline Service Worker
        self.addEventListener('install', e => {
            e.waitUntil(caches.open('resume-cache').then(cache => {
                return cache.addAll(['index.html', 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js']);
            }));
        });
        self.addEventListener('fetch', e => {
            e.respondWith(caches.match(e.request).then(response => response || fetch(e.request)));
        });
    </script>
</body>
</html>
